        relation_id: { type: string, format: uuid }
        memory_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        current_revision_id: { type: string, format: uuid }
        current_state: { $ref: '#/components/schemas/StoredMemoryState' }
        sensitivity: { $ref: '#/components/schemas/Sensitivity' }
    Aggregate:
      type: object
      additionalProperties: false
      required: [aggregate_id, memory, aggregate_kind, policy_version, processing_version, sensitivity, freshness, aggregate_stale, stale_reasons, input_fingerprint, generation, provenance, checked_at]
      properties:
        aggregate_id: { type: string, format: uuid }
        memory: { $ref: '#/components/schemas/Memory' }
        aggregate_kind: { $ref: '#/components/schemas/AggregateKind' }
        policy_version: { type: string }
        processing_version: { type: string }
        sensitivity: { $ref: '#/components/schemas/Sensitivity' }
        freshness: { type: string, enum: [fresh, stale] }
        aggregate_stale: { type: boolean }
        stale_reasons: { type: array, items: { type: string } }
        input_fingerprint: { type: string }
        generation: { type: integer, minimum: 0 }
        provenance: { type: array, items: { $ref: '#/components/schemas/AggregateProvenance' } }
        checked_at: { type: string, format: date-time }
    AggregatePage: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Aggregate' } }, next_cursor: { type: [string, 'null'] } } }
    ConflictRef:
      type: object
      additionalProperties: false
      required: [case_id, relation_id, other_memory_id, other_revision_id]
      properties:
        case_id: { type: string, format: uuid }
        relation_id: { type: string, format: uuid }
        other_memory_id: { type: string, format: uuid }
        other_revision_id: { type: string, format: uuid }
    RecallEvidence:
      type: object
      additionalProperties: false
      required: [evidence_id, event_id, role]
      properties:
        evidence_id: { type: string }
        event_id: { type: string, format: uuid }
        event_time: { type: string, format: date-time }
        event_sequence: { type: integer, minimum: 0 }
        role: { type: string, enum: [direct, derived, temporal_anchor, context] }
        start_offset: { type: integer, minimum: 0 }
        end_offset: { type: integer, minimum: 1 }
    RecallExplanation:
      type: object
      additionalProperties: false
      required: [matched_signals, selection_reason]
      properties:
        matched_signals: { type: array, uniqueItems: true, items: { type: string, enum: [keyword, semantic, graph] } }
        selection_reason: { type: string }
    ContextItem:
      type: object
      additionalProperties: false
      required: [rank, memory_id, revision_id, kind, display_content, confidence, lifecycle_state, estimated_tokens]
      properties:
        rank: { type: integer, minimum: 1 }
        memory_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        kind: { type: string, enum: [fact, event, preference, plan, procedure, scene, topic, timeline] }
        display_content: { type: string }
        event_time_start: { type: string, format: date-time }
        event_time_end: { type: string, format: date-time }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        source_speaker: { type: string }
        evidence: { type: array, items: { $ref: '#/components/schemas/RecallEvidence' } }
        confidence: { type: number, minimum: 0, maximum: 1 }
        lifecycle_state: { $ref: '#/components/schemas/StoredMemoryState' }
        estimated_tokens: { type: integer, minimum: 0 }
        explanation: { $ref: '#/components/schemas/RecallExplanation' }
    ContextPackage:
      type: object
      additionalProperties: false
      required: [items, tokens_used, chars_used, truncated, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ContextItem' } }
        tokens_used: { type: integer, minimum: 0 }
        chars_used: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        next_cursor: { type: [string, 'null'] }
    RecallExecutionMetadata:
      type: object
      additionalProperties: false
      required: [operation_id, intent, reference_time, requested_capabilities, executed_capabilities, degraded, degradation_reasons, query_plan_identity, ranking_identity, context_selection_identity]
      properties:
        operation_id: { type: string, format: uuid }
        intent: { $ref: '#/components/schemas/RecallIntent' }
        reference_time: { type: string, format: date-time }
        requested_capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [keyword, semantic, graph] }
        executed_capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [keyword, semantic, graph] }
          description: Capabilities that actually executed; a subset of requested_capabilities when degradation occurred.
        degraded: { type: boolean }
        degradation_reasons: { type: array, items: { type: string, enum: [keyword_unavailable, semantic_unavailable, semantic_stale, semantic_policy_denied, semantic_policy_changed] } }
        query_plan_identity: { type: string, minLength: 1 }
        ranking_identity: { type: string, minLength: 1 }
        context_selection_identity: { type: string, minLength: 1 }
    RecallResponse:
      type: object
      additionalProperties: false
      required: [context, execution]
      properties:
        context: { $ref: '#/components/schemas/ContextPackage' }
        execution: { $ref: '#/components/schemas/RecallExecutionMetadata' }
    GraphSignal:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [direct_entity_mention, exact_predicate_fact, one_hop_fact, two_hop_path, memory_relation, graph_conflict] }
        entity_id: { type: string, format: uuid }
        predicate: { type: string }
        fact_id: { type: string, format: uuid }
        relation_id: { type: string, format: uuid }
        relation_type: { $ref: '#/components/schemas/RelationType' }
        relation_direction: { type: string, enum: [outgoing, incoming] }
        hop: { type: integer, minimum: 0 }
        entity_confidence: { type: number }
        fact_confidence: { type: number }
    GraphPath:
      type: object
      required: [start_entity_id, edges, end_entity_id, hop]
      properties:
        start_entity_id: { type: string, format: uuid }
        edges:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/GraphPathEdge' }
        end_entity_id: { type: string, format: uuid }
        hop: { type: integer, minimum: 1 }
    GraphPathEdge:
      type: object
      required: [fact_id, subject_entity_id, predicate, object_entity_id]
      properties:
        fact_id: { type: string, format: uuid }
        subject_entity_id: { type: string, format: uuid }
        predicate: { type: string }
        object_entity_id: { type: string, format: uuid }
        confidence: { type: number }
        source_memory_id: { type: string, format: uuid }
        source_revision_id: { type: string, format: uuid }
    ResolvedEntity:
      type: object
      required: [entity_id, entity_type, alias, confidence, match_kind, start_rune, end_rune]
      properties:
        entity_id: { type: string, format: uuid }
        entity_type: { type: string }
        alias: { type: string }
        confidence: { type: number }
        match_kind: { type: string }
        start_rune: { type: integer, minimum: 0 }
        end_rune: { type: integer, minimum: 0 }
    JobReference:
      type: object
      required: [operation_id, job_id]
      properties:
        operation_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
    Job:
      type: object
      required: [job_id, operation_id, job_type, target_type, target_id, status, attempt_count, max_attempts, created_at]
      properties:
        job_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        job_type: { type: string, enum: [extract_memory, extract_graph, embed_memory, rebuild_fts, rebuild_semantic, rebuild_entity_index, rebuild_relation_index, rebuild_graph_index, aggregate_feedback, rebuild_feedback_aggregates, rebuild_aggregate] }
        target_type: { type: string, enum: [raw_event, memory_revision, index, aggregate] }
        target_id: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        result_code: { type: [string, 'null'] }
        last_error_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    Health:
      type: object
      additionalProperties: false
      required: [process_alive, mode, overall_status, ready, accepting_writes, query_available, storage_state, storage_healthy, storage_writable, storage_integrity_state, schema_compatibility, queue_state, fts_state, fts_index_state, fts_freshness, processor_state, processor_identity, semantic_state, semantic_index_state, semantic_index_version, entity_index_state, entity_index_version, relation_index_state, relation_index_version, graph_index_state, graph_index_version, feedback_aggregate_state, feedback_aggregate_version, aggregate_state, aggregate_fresh_count, aggregate_stale_count, aggregate_pending_rebuilds, backup_state, job_queue_depth, oldest_job_age_seconds, disk_pressure]
      properties:
        process_alive: { type: boolean }
        mode: { type: string, enum: [healthy, degraded, read_only, maintenance, unavailable] }
        overall_status: { type: string, enum: [healthy, degraded, read_only, maintenance, unavailable] }
        ready: { type: boolean }
        accepting_writes: { type: boolean }
        query_available: { type: boolean }
        storage_state: { type: string, enum: [ready, degraded, unavailable] }
        storage_healthy: { type: boolean }
        storage_writable: { type: boolean }
        storage_integrity_state: { type: string, enum: [unknown, off, pending, ready, failed] }
        schema_compatibility: { type: string, enum: [compatible, incompatible, unknown] }
        queue_state: { type: string, enum: [ready, degraded, unavailable] }
        fts_state: { type: string, enum: [ready, degraded, unavailable, rebuilding] }
        fts_index_state: { type: string, enum: [ready, degraded, unavailable, rebuilding] }
        fts_freshness: { type: string, enum: [current, stale, unknown] }
        processor_state: { type: string, enum: [not_configured, ready, degraded, unavailable] }
        processor_identity: { type: string }
        semantic_state: { type: string, enum: [not_configured, rebuild_required, ready, degraded, unavailable, rebuilding] }
        semantic_index_state: { type: string, enum: [not_configured, rebuild_required, ready, degraded, unavailable, rebuilding] }
        semantic_index_version: { type: integer, minimum: 0 }
        entity_index_state: { type: string, enum: [ready, stale, rebuilding, unavailable] }
        entity_index_version: { type: integer, minimum: 0 }
        relation_index_state: { type: string, enum: [ready, stale, rebuilding, unavailable] }
        relation_index_version: { type: integer, minimum: 0 }
        graph_index_state: { type: string, enum: [ready, stale, rebuilding, unavailable] }
        graph_index_version: { type: integer, minimum: 0 }
        feedback_aggregate_state: { type: string, enum: [ready, stale, rebuilding, unavailable] }
        feedback_aggregate_version: { type: integer, minimum: 0 }
        aggregate_state: { type: string, enum: [ready, stale, rebuilding, unavailable] }
        aggregate_fresh_count: { type: integer, minimum: 0 }
        aggregate_stale_count: { type: integer, minimum: 0 }
        aggregate_pending_rebuilds: { type: integer, minimum: 0 }
        backup_state: { type: string, enum: [ready, degraded, unavailable] }
        job_queue_depth: { type: integer, minimum: 0 }
        oldest_job_age_seconds: { type: integer, minimum: 0 }
        disk_pressure: { type: string, enum: [normal, soft, hard] }
        configuration_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    ReloadConfigurationRequest:
      type: object
      additionalProperties: false
      properties:
        expected_effective_identity: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$' }
