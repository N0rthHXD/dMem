      type: object
      additionalProperties: false
      required: [attempt_id, outcome, active_source_identity, active_effective_identity, changed_capabilities, reconciliation_state]
      properties:
        attempt_id: { type: string }
        outcome: { type: string, enum: [activated, no_change] }
        previous_effective_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        active_source_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        active_effective_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        changed_capabilities: { type: array, items: { type: string, enum: [processing, embedding] }, uniqueItems: true }
        reconciliation_state: { type: string, enum: [idle, queued, running, failed] }
    ConfigurationStatus:
      type: object
      additionalProperties: false
      required: [state, activation_generation, active_source_identity, active_effective_identity, activated_at, last_attempt, capabilities]
      properties:
        state: { type: string, enum: [active] }
        activation_generation: { type: integer, minimum: 1 }
        active_source_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        active_effective_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        activated_at: { type: string, format: date-time }
        last_attempt: { $ref: '#/components/schemas/ConfigurationAttempt' }
        capabilities:
          type: object
          additionalProperties: false
          required: [processing, embedding]
          properties:
            processing: { $ref: '#/components/schemas/ConfigurationCapability' }
            embedding: { $ref: '#/components/schemas/ConfigurationCapability' }
    ConfigurationAttempt:
      type: object
      additionalProperties: false
      required: [attempt_id, trigger, outcome, started_at, finished_at, diagnostics]
      properties:
        attempt_id: { type: string }
        trigger: { type: string, enum: [startup, api, sighup] }
        outcome: { type: string, enum: [activated, no_change, rejected, failed] }
        source_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        error_code: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/ConfigurationDiagnostic' } }
    ConfigurationDiagnostic:
      type: object
      additionalProperties: false
      required: [code, path]
      properties:
        code: { type: string }
        path: { type: string }
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
    ConfigurationCapability:
      type: object
      additionalProperties: false
      required: [enabled, state, configuration_generation, policy_generation, blocked_work_count, reconciliation_state]
      properties:
        enabled: { type: boolean }
        kind: { type: string }
        model: { type: string }
        configuration_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        compatibility_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        policy_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        secret_available: { type: boolean }
        policy_content_types: { type: array, items: { type: string } }
        policy_source_types: { type: array, items: { type: string } }
        policy_sensitivities: { type: array, items: { type: string } }
        policy_assignment_count: { type: integer, minimum: 0 }
        state: { type: string, enum: [disabled, ready, degraded, unavailable] }
        configuration_generation: { type: integer, minimum: 0 }
        policy_generation: { type: integer, minimum: 0 }
        blocked_work_count: { type: integer, minimum: 0 }
        reconciliation_state: { type: string, enum: [idle, queued, running, failed] }
    Error:
      type: object
      required: [error_code, message, request_id, operation_id, retryable]
      properties:
        error_code: { type: string }
        message: { type: string }
        request_id: { type: string }
        operation_id: { type: string }
        retryable: { type: boolean }
        retry_after: { type: [integer, 'null'], minimum: 0 }
        details: { type: object }
  responses:
    SpaceCreated:
      description: Space created
