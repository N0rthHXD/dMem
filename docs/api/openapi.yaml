    AggregateProposalPage: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AggregateProposal' } }, next_cursor: { type: [string, 'null'] } } }
    AggregateProvenance:
      type: object
      additionalProperties: false
      required: [relation_id, memory_id, revision_id, current_revision_id, current_state, sensitivity]
