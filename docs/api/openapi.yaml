        Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Space' } } }
    SpaceFound:
      description: Space found
      content: { application/json: { schema: { $ref: '#/components/schemas/Space' } } }
    InvalidRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InvalidJSON:
      description: Malformed JSON body
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Revision, state, or idempotency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Object not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Overloaded:
      description: Temporary overload
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ResourceExhausted:
