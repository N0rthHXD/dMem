openapi: 3.1.0
info:
  title: dMeM Local API
  version: 1.0.0
  description: HTTP/JSON API served over a Unix Domain Socket. Logical portability remains an offline service per ADR 0029; filesystem paths are not accepted by this API.
servers:
  - url: http://localhost/v1
    description: Logical URL; transport is a Unix Domain Socket.
paths:
  /remember:
    post:
      operationId: remember
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RememberRequest' }
      responses:
        '201':
          description: Memory and its source event were durably created
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RememberResponse' }
  /recall:
    post:
      operationId: recall
      parameters:
        - $ref: '#/components/parameters/callerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecallRequest' }
      responses:
        '200':
          description: Agent-ready structured memory context and execution metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecallResponse' }
  /memories/{memory_id}/feedback:
    post:
      operationId: feedbackMemory
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/memoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryFeedbackRequest' }
      responses:
        '201':
          description: Feedback attached to the current memory revision
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackAppendResponse' }
  /memories/{memory_id}/forget:
    post:
      operationId: forgetMemory
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/memoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgetRequest' }
      responses:
        '200':
          description: Memory was logically deleted and removed from recall
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForgetResponse' }
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Daemon health
          content:
            application/json:
                schema: { $ref: '#/components/schemas/Health' }
  /config:
    get:
      operationId: getConfigurationStatus
      parameters: [{ $ref: '#/components/parameters/callerId' }]
      responses:
        '200':
          description: Redacted active configuration and latest activation attempt
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationStatus' } } }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /config/reload:
    post:
      operationId: reloadConfiguration
      parameters: [{ $ref: '#/components/parameters/callerId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReloadConfigurationRequest' } } }
      responses:
        '200':
          description: Configuration activated or unchanged
          headers: { Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReloadConfigurationResponse' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /spaces:
    post:
      operationId: createSpace
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSpaceRequest' }
      responses:
        '201': { $ref: '#/components/responses/SpaceCreated' }
        '400': { $ref: '#/components/responses/InvalidJSON' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
    get:
      operationId: listSpaces
      parameters:
        - $ref: '#/components/parameters/callerId'
        - { name: parent_space_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Space page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpacePage' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /spaces/{space_id}:
    get:
      operationId: getSpace
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/spaceId'
      responses:
        '200': { $ref: '#/components/responses/SpaceFound' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /events:
    post:
      operationId: ingestEvent
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestEventRequest' }
      responses:
        '202':
          description: Event durably accepted
          headers:
            Idempotent-Replay: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestEventResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/InvalidJSON' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '429': { $ref: '#/components/responses/Overloaded' }
        '507': { $ref: '#/components/responses/ResourceExhausted' }
    get:
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/callerId'
        - { name: space_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: source_name, in: query, schema: { type: string } }
        - { name: occurred_from, in: query, schema: { type: string, format: date-time } }
        - { name: occurred_until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Event page ordered by occurred_at DESC, event_id DESC
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /events/{event_id}:
    get:
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/eventId'
      responses:
        '200':
          description: Raw event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RawEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /events/{event_id}/replay:
    post:
      operationId: replayEvent
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/eventId'
      responses:
        '202':
          description: Processing job accepted. The daemon's current processing version selects identity; replay after a configured version change creates a distinct job and result.
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReference' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /memories:
    post:
      operationId: createMemory
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMemoryRequest' }
      responses:
        '201':
          description: Memory created
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memory' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/InvalidJSON' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
    get:
      operationId: listMemories
      parameters:
        - $ref: '#/components/parameters/callerId'
        - { name: space_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: include_ancestors, in: query, schema: { type: boolean, default: true } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/MemoryState' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Memory page ordered by updated_at DESC, memory_id DESC
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryPage' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /memories/{memory_id}:
    get:
      operationId: getMemory
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/memoryId'
      responses:
        '200':
          description: Current memory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memory' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
    patch:
      operationId: reviseMemory
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/memoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviseMemoryRequest' }
      responses:
        '200':
          description: New revision created
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memory' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/InvalidJSON' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /memories/{memory_id}/revisions:
    get:
      operationId: listMemoryRevisions
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/memoryId'
      responses:
        '200':
          description: Revisions ordered by created_at DESC
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemoryRevision' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /memories/{memory_id}/state:
    post:
      operationId: changeMemoryState
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/memoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMemoryStateRequest' }
      responses:
        '200':
          description: State changed
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memory' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/InvalidJSON' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /memories/{memory_id}/state-events:
    get:
      operationId: listMemoryStateEvents
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/memoryId'
      responses:
        '200':
          description: State history ordered by created_at DESC, state_event_id DESC
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemoryStateEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /candidates:
    get:
      operationId: listCandidates
      parameters:
        - $ref: '#/components/parameters/callerId'
        - { name: space_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: review_state, in: query, schema: { $ref: '#/components/schemas/CandidateReviewState' } }
        - { name: memory_type, in: query, schema: { $ref: '#/components/schemas/MemoryKind' } }
        - { name: processor_identity, in: query, schema: { type: string } }
        - { name: processing_version, in: query, schema: { type: string } }
        - { name: created_from, in: query, schema: { type: string, format: date-time } }
        - { name: created_until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Candidate page ordered by created_at DESC, candidate_id DESC
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatePage' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /candidates/{candidate_id}:
    get:
      operationId: getCandidate
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/candidateId'
      responses:
        '200':
          description: Candidate, evidence, related suggestions, and review history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /candidates/{candidate_id}/confirm:
    post:
      operationId: confirmCandidate
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/candidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCandidateRequest' }
      responses:
        '201':
          description: Candidate confirmed and active memory created atomically
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memory' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/InvalidJSON' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /candidates/{candidate_id}/reject:
    post:
      operationId: rejectCandidate
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/candidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCandidateRequest' }
      responses:
        '200':
          description: Candidate rejected without creating a memory
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/InvalidJSON' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /jobs/{job_id}:
    get:
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /jobs/{job_id}/cancel:
    post:
      operationId: cancelJob
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Cancellation requested or completed
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /jobs/{job_id}/retry:
    post:
      operationId: retryJob
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/jobId'
      responses:
        '202':
          description: Failed job scheduled again
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /indexes/fts/rebuild:
    post:
      operationId: rebuildFts
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202':
          description: Rebuild job accepted
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReference' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '507': { $ref: '#/components/responses/ResourceExhausted' }
  /indexes/semantic/rebuild:
    post:
      operationId: rebuildSemantic
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202':
          description: Semantic rebuild job accepted
          headers:
            Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReference' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '507': { $ref: '#/components/responses/ResourceExhausted' }
  /entity-proposals:
    post:
      operationId: createEntityProposal
      parameters: [{ $ref: '#/components/parameters/callerId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEntityProposalRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/EntityProposalCreated' }
        '400': { $ref: '#/components/responses/InvalidJSON' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
    get:
      operationId: listEntityProposals
      parameters:
        - $ref: '#/components/parameters/callerId'
        - { name: space_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: review_state, in: query, schema: { $ref: '#/components/schemas/ReviewState' } }
        - { name: proposal_kind, in: query, schema: { $ref: '#/components/schemas/EntityProposalKind' } }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: Entity proposal page, content: { application/json: { schema: { $ref: '#/components/schemas/EntityProposalPage' } } } }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /entity-proposals/{proposal_id}:
    get:
      operationId: getEntityProposal
      parameters: [{ $ref: '#/components/parameters/callerId' }, { $ref: '#/components/parameters/proposalId' }]
      responses:
        '200': { description: Entity proposal, content: { application/json: { schema: { $ref: '#/components/schemas/EntityProposal' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /entity-proposals/{proposal_id}/confirm:
    post:
      operationId: confirmEntityProposal
      parameters: [{ $ref: '#/components/parameters/callerId' }, { $ref: '#/components/parameters/idempotencyKey' }, { $ref: '#/components/parameters/proposalId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewProposalRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/EntityProposalCreated' }
        '400': { $ref: '#/components/responses/InvalidJSON' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /entity-proposals/{proposal_id}/reject:
    post:
      operationId: rejectEntityProposal
      parameters: [{ $ref: '#/components/parameters/callerId' }, { $ref: '#/components/parameters/idempotencyKey' }, { $ref: '#/components/parameters/proposalId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewProposalRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/EntityProposalOK' }
        '400': { $ref: '#/components/responses/InvalidJSON' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /entities:
    get:
      operationId: listEntities
      parameters:
        - $ref: '#/components/parameters/callerId'
        - { name: space_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: include_mentions, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': { description: Entity page, content: { application/json: { schema: { $ref: '#/components/schemas/EntityPage' } } } }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /entities/{entity_id}:
    get:
      operationId: getEntity
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/entityId'
        - { name: space_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: include_mentions, in: query, schema: { type: boolean, default: true } }
      responses:
        '200': { description: Entity, content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /entities/{entity_id}/merge:
    post:
      operationId: mergeEntity
      parameters: [{ $ref: '#/components/parameters/callerId' }, { $ref: '#/components/parameters/idempotencyKey' }, { $ref: '#/components/parameters/entityId' }]
      responses:
