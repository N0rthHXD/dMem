components:
  headers:
    IdempotentReplay:
      schema: { type: boolean }
      description: False for first execution and true for a replayed response.
  parameters:
    callerId:
      name: X-Caller-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    spaceId: { name: space_id, in: path, required: true, schema: { type: string, format: uuid } }
    eventId: { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
    memoryId: { name: memory_id, in: path, required: true, schema: { type: string, format: uuid } }
    candidateId: { name: candidate_id, in: path, required: true, schema: { type: string, format: uuid } }
    jobId: { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
    proposalId: { name: proposal_id, in: path, required: true, schema: { type: string, format: uuid } }
    entityId: { name: entity_id, in: path, required: true, schema: { type: string, format: uuid } }
    relationId: { name: relation_id, in: path, required: true, schema: { type: string, format: uuid } }
    caseId: { name: case_id, in: path, required: true, schema: { type: string, format: uuid } }
    aggregateId: { name: aggregate_id, in: path, required: true, schema: { type: string, format: uuid } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    cursor: { name: cursor, in: query, schema: { type: string } }
  schemas:
    RememberRequest:
      type: object
      additionalProperties: false
      required: [space_id, content]
      properties:
        space_id: { type: string, format: uuid }
        content: { type: string, minLength: 1 }
        kind: { $ref: '#/components/schemas/MemoryKind' }
