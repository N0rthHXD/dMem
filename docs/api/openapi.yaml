      content: { application/json: { schema: { $ref: '#/components/schemas/EvolutionProposal' } } }
    EvolutionProposalOK:
      description: Evolution proposal rejected
      headers: { Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/EvolutionProposal' } } }
    ConflictCaseOK:
      description: Conflict resolved
      headers: { Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ConflictCase' } } }
    FeedbackCreated:
