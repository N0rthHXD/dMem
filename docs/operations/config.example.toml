# dMem production configuration example.
#
# Copy this file to ${XDG_CONFIG_HOME:-$HOME/.config}/dmem/config.toml and
# edit the absolute paths below for your user. Secret values are supplied
# through environment variables referenced by [*.provider.secret]; they are
# never stored in this file.
#
# Validate offline before starting the daemon:
#   dmemd --config /absolute/path/config.toml config validate

config_version = 1

[instance]
data_dir = "/home/USER/.local/share/dmem"
runtime_dir = "/run/user/1000/dmem"
database_filename = "dmem.db"
socket_filename = "dmem.sock"

[server]
request_timeout = "30s"
shutdown_grace_period = "15s"
max_connections = 64
max_request_bytes = 4194304

[jobs]
worker_count = 2
queue_soft_limit = 10000
queue_hard_limit = 20000
max_attempts = 3
lease_duration = "30s"
per_job_timeout = "2m"
retry_initial_backoff = "1s"
retry_max_backoff = "5m"

[storage]
disk_soft_free_bytes = 1073741824
disk_hard_free_bytes = 268435456

# Deterministic candidate consolidation (ADR 0035). Cosine thresholds never
# supersede, contest, or delete on their own.
[consolidation]
version = "consolidation-v1"
max_candidates = 32
exact_hash_enabled = true
same_source_event_cosine = 0.90
same_subject_kind_cosine = 0.94

# Semantic calibration replaces the fixed score floor with an absolute floor
# plus a top-score margin.
[semantic]
calibration_version = "semantic-calibration-v1"
absolute_floor = 0.35
top_margin = 0.08

# Gated graph retrieval. policy is one of off | features_only | direct | bounded_path.
[graph]
policy = "features_only"
min_entity_confidence = 0.60
min_fact_confidence = 0.70
boost_cap = 0.08

# Deterministic feature ranker. Weights are starting values, not fixed truths.
[ranking]
version = "ranking-weights-v1"
semantic_weight = 1.0
keyword_weight = 0.35
exact_weight = 0.15
temporal_weight = 0.10
quality_weight = 0.10
agreement_weight = 0.05

# Budgeted context selection. max_context_chars must be at least max_context_tokens.
[context]
version = "context-selection-v1"
max_context_tokens = 4000
max_context_chars = 16000
max_results = 20

[processing]
version = "builtin-noop-v1"
# Controls knowledge-graph extraction (extract_graph). Defaults to true so that
# graph extraction follows the processing provider. Set false to run processing
# without graph extraction (for example, to isolate retrieval baselines).
# graph_enabled = true

[processing.provider]
enabled = false

[embedding.provider]
enabled = false

# A provider is enabled by replacing its minimal disabled section with a
# complete section. Secret values are supplied externally and never stored here.
# The processing provider drives both memory-candidate extraction
# (extract_memory) and knowledge-graph extraction (extract_graph).
# Knowledge-graph extraction is additionally gated by [processing].graph_enabled.
#
# [processing]
# version = "processor-v1"
# graph_enabled = true
#
# [processing.provider]
# enabled = true
# kind = "openai-compatible"
# endpoint = "https://provider.example/v1/chat/completions"
# model = "model-a"
# telemetry_disabled = true
#
# [processing.provider.secret]
# source = "environment"
# name = "DMEM_PROCESSING_API_KEY"
#
# [processing.provider.limits]
# max_egress_input_chars = 12000
# max_aggregate_input_chars = 48000
# max_context_items = 8
# max_candidate_chars = 12000
# max_total_candidate_chars = 48000
# max_response_bytes = 1048576
# request_timeout = "30s"
# max_concurrent = 2
# requests_per_minute = 60
#
# [processing.provider.policy]
# default = "deny"
# content_types = ["application/json", "text/plain"]
# source_types = ["manual", "message", "conversation"]
# sensitivities = ["normal"]
#
# [[processing.provider.policy.assignments]]
# selector = "space"
# space_id = "11111111-1111-4111-8111-111111111111"
# effect = "allow"
# include_descendants = true
#
# [embedding.provider]
# enabled = true
# kind = "openai-compatible"
# endpoint = "https://provider.example/v1/embeddings"
# model = "embedding-a"
# telemetry_disabled = true
#
# [embedding.provider.secret]
# source = "environment"
# name = "DMEM_EMBEDDING_API_KEY"
#
# [embedding.provider.options]
# dimensions = 1024
# query_instructions = "query: "
#
# [embedding.provider.limits]
# max_egress_input_chars = 12000
# max_response_bytes = 1048576
# request_timeout = "30s"
# max_concurrent = 2
# requests_per_minute = 60
#
# [embedding.provider.policy]
# default = "deny"
# query = "allow"
# content_types = ["text/plain"]
# source_types = ["manual", "message", "conversation"]
# sensitivities = ["normal"]
#
# [[embedding.provider.policy.assignments]]
# selector = "space_type"
# space_type = "project"
# effect = "allow"
# priority = 100
