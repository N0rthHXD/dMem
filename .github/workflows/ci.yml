name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "1"
  GOFLAGS: "-tags=sqlite_fts5"
  DMEM_PROCESSING_PROVIDER_API_KEY: ""
  DMEM_EMBEDDING_PROVIDER_API_KEY: ""

jobs:
  checks:
    name: Linux amd64 / Go ${{ matrix.go }} / offline gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - minimum
          - stable
    steps:
      - uses: actions/checkout@v4
      - name: Set up minimum Go from go.mod
        if: matrix.go == 'minimum'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up stable Go
        if: matrix.go == 'stable'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run checks
        run: make check

  vulnerability-scan:
    name: Linux amd64 / govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan
        run: make govulncheck

  release-smoke:
    name: Linux amd64 / release smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build release binary
        run: CGO_ENABLED=1 go build -tags sqlite_fts5 -o dmemd ./cmd/dmemd
      - name: Validate, initialize, and back up
        run: |
          root="$(mktemp -d)"
          install -d -m 0700 "$root/data"
          cat > "$root/config.toml" <<EOF
          config_version = 1

          [instance]
          data_dir = "$root/data"
          database_filename = "dmem.db"

          [server]
          shutdown_grace_period = "15s"

          [jobs]
          worker_count = 1
          queue_soft_limit = 10
          queue_hard_limit = 20
          max_attempts = 3
          lease_duration = "30s"
          per_job_timeout = "2m"
          retry_initial_backoff = "1s"
          retry_max_backoff = "5m"

          [storage]
          disk_soft_free_bytes = 1073741824
          disk_hard_free_bytes = 268435456

          [processing]
          version = "builtin-noop-v1"

          [processing.provider]
          enabled = false

          [embedding.provider]
          enabled = false
          EOF
          ./dmemd --config "$root/config.toml" config validate
          ./dmemd --config "$root/config.toml" init
          ./dmemd --config "$root/config.toml" backup --target "$root/backup"
          test -f "$root/backup/manifest.json"
