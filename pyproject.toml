[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmem-evaluation"
version = "1.0.0"
description = "dMem benchmark evaluation suites (LoCoMo, LongMemEval, calibration)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.50",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["dmem_eval", "dmem_locomo", "dmem_longmemeval", "dmem_calibration"]

[tool.setuptools.package-dir]
dmem_eval = "evaluation/common/dmem_eval"
dmem_locomo = "evaluation/locomo/dmem_locomo"
dmem_longmemeval = "evaluation/longmemeval/dmem_longmemeval"
dmem_calibration = "evaluation/calibration/dmem_calibration"

[tool.pytest.ini_options]
pythonpath = [
    "evaluation/common",
    "evaluation/locomo",
    "evaluation/longmemeval",
    "evaluation/calibration",
]
testpaths = [
    "evaluation/calibration/tests",
    "evaluation/common/tests",
    "evaluation/locomo/tests",
    "evaluation/longmemeval/tests",
]
