openapi: 3.1.0
info:
  title: dMem Configuration API Additions
  version: 1.0.0
  description: Contract fragment to merge into docs/api/openapi.yaml.
paths:
  /config:
    get:
      operationId: getConfigurationStatus
      parameters:
        - $ref: '#/components/parameters/CallerId'
      responses:
        '200':
          description: Redacted effective configuration and activation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationStatus'
  /config/reload:
    post:
      operationId: reloadConfiguration
      parameters:
        - $ref: '#/components/parameters/CallerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadConfigurationRequest'
      responses:
        '200':
          description: Configuration activated or unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadConfigurationResponse'
        '409':
          description: Expected revision conflict or reload already committing
        '413':
          description: Selected file exceeds the supported bound
        '422':
          description: Configuration invalid or changes restart-bound fields
        '503':
          description: File unavailable or activation resources cannot be prepared
components:
  parameters:
    CallerId:
      name: X-Caller-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    ReloadConfigurationRequest:
      type: object
      additionalProperties: false
      properties:
        expected_effective_identity:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
    ReloadConfigurationResponse:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - outcome
        - active_source_identity
        - active_effective_identity
        - changed_capabilities
        - reconciliation_state
      properties:
        attempt_id: { type: string, format: uuid }
        outcome: { type: string, enum: [activated, no_change] }
        previous_effective_identity:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
        active_source_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        active_effective_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        changed_capabilities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [processing, embedding] }
        reconciliation_state: { type: string, enum: [idle, queued, running, failed] }
    ConfigurationStatus:
      type: object
      additionalProperties: false
      required:
        - state
        - activation_generation
        - active_source_identity
        - active_effective_identity
        - activated_at
        - last_attempt
        - capabilities
      properties:
        state: { type: string, enum: [active, degraded] }
        activation_generation: { type: integer, minimum: 1 }
        active_source_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        active_effective_identity: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        activated_at: { type: string, format: date-time }
        last_attempt:
          $ref: '#/components/schemas/ConfigurationAttempt'
        capabilities:
          type: object
          additionalProperties: false
          required: [processing, embedding]
          properties:
            processing: { $ref: '#/components/schemas/CapabilityStatus' }
            embedding: { $ref: '#/components/schemas/CapabilityStatus' }
    ConfigurationAttempt:
      type: object
      additionalProperties: false
      required: [attempt_id, trigger, outcome, started_at, finished_at, diagnostics]
      properties:
        attempt_id: { type: string, format: uuid }
        trigger: { type: string, enum: [startup, api, sighup] }
        outcome: { type: string, enum: [activated, no_change, rejected, failed] }
        source_identity:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
        error_code: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/ConfigurationDiagnostic' }
    ConfigurationDiagnostic:
      type: object
      additionalProperties: false
      required: [code, path]
      properties:
        code: { type: string }
        path: { type: string }
        line: { type: [integer, 'null'], minimum: 1 }
        column: { type: [integer, 'null'], minimum: 1 }
    CapabilityStatus:
      type: object
      additionalProperties: false
      required:
        - enabled
        - state
        - configuration_generation
        - policy_generation
        - blocked_work_count
        - reconciliation_state
      properties:
        enabled: { type: boolean }
        state: { type: string, enum: [disabled, ready, degraded, unavailable, blocked_secret, reconciling] }
        configuration_identity:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
        compatibility_identity:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
        configuration_generation: { type: integer, minimum: 0 }
        policy_identity:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
        policy_generation: { type: integer, minimum: 0 }
        secret_reference:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SecretReferenceStatus'
        blocked_work_count: { type: integer, minimum: 0 }
        reconciliation_state: { type: string, enum: [idle, queued, running, failed] }
    SecretReferenceStatus:
      type: object
      additionalProperties: false
      required: [source, name, available]
      properties:
        source: { type: string, enum: [environment] }
        name: { type: string, pattern: '^[A-Z_][A-Z0-9_]*$' }
        available: { type: boolean }
